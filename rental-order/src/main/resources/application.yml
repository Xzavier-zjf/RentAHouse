server:
  port: 9003

spring:
  application:
    name: rental-order
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rental_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    date-format: yyyy-MM-dd
    serialization:
      write-dates-as-timestamps: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

rental-message:
  url: ${RENTAL_MESSAGE_URL:http://localhost:9005}

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.example.rentalorder.entity

rental:
  jwt:
    secret: ${RENTAL_JWT_SECRET:local-dev-rental-platform-secret-change-me}
    expire-seconds: ${RENTAL_JWT_EXPIRE_SECONDS:7200}

debug: ${APP_DEBUG:false}
