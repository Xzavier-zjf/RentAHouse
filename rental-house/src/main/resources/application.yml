server:
  port: 9002

spring:
  application:
    name: rental-house
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rental_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/rental_platform_files}
  jackson:
    date-format: yyyy-MM-dd
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.example.rentalhouse.entity

rental:
  jwt:
    secret: ${RENTAL_JWT_SECRET:local-dev-rental-platform-secret-change-me}
    expire-seconds: ${RENTAL_JWT_EXPIRE_SECONDS:7200}

debug: ${APP_DEBUG:false}
