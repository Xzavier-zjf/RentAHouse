server:
  port: 9004

spring:
  application:
    name: rental-comment
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rental_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

rental-user:
  url: ${RENTAL_USER_URL:http://localhost:9001}

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.example.rentalcomment.entity

rental:
  jwt:
    secret: ${RENTAL_JWT_SECRET:local-dev-rental-platform-secret-change-me}
    expire-seconds: ${RENTAL_JWT_EXPIRE_SECONDS:7200}

debug: ${APP_DEBUG:false}
